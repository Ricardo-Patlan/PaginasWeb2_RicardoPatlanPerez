<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Calculadora App</title>
</head>

<body>

  <div class="container mt-5">
    <h1 id="titulo">Calculadora básica</h1>
    <p class="text-muted">Ingresa los operadores correspondientes y da click en la operación que quieres realizar.</p>

    <form id="formularioOperaciones">
      <div class="mb-3">
        <label for="Numero1" class="form-label">Número 1</label>
        <input type="number" class="form-control" id="Numero1" name="Operador1" placeholder="Ingresa el operador 1">
      </div>
      <div class="mb-3">
        <label for="Numero2" class="form-label">Número 2</label>
        <input type="number" class="form-control" id="Numero2" name="Operador2" placeholder="Ingresa el operador 2">
      </div>
    </form>

    <div class="d-flex gap-2 mb-4">
      <button class="btn btn-primary" onclick="Sumar()">Sumar</button>
      <button class="btn btn-primary" onclick="Restar()">Restar</button>
      <button class="btn btn-primary" onclick="Multiplicar()">Multiplicar</button>
      <button class="btn btn-primary" onclick="Dividir()">Dividir</button>
    </div>

    <div id="resultadoSuma" class="text-successfs-5"></div>
    <div id="resultadoResta" class="text-success fs-5"></div>
    <div id="resultadoMultiplicacion" class="text-success fs-5"></div>
    <div id="resultadoDivision" class="text-success fs-5"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Calculadora_Ej1/Calculadora.js"></script>
</body>

</html>
